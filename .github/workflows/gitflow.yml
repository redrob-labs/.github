# Gitflow rules shared by every redrob-labs repository -- the reusable form.
#
# Two rules, two jobs, two triggers, because they answer different questions at different moments:
#
#   1. branch-name   A working branch is `<type>/<short-slug>` with `type` from ONE org-wide list.
#                    Judged when a pull request exists.
#   2. back-merged   `main` is contained in `develop`. Judged after `main` has moved. When it is not,
#                    the job opens (or refreshes) the back-merge pull request itself, so the gap is a
#                    pull request to merge rather than a red run somebody has to notice.
#
# Called from a repository's `.github/workflows/gitflow.yml`:
#
#   on:
#     pull_request:
#       types: [opened, reopened, edited, synchronize]
#     push:
#       branches: [main]
#     workflow_dispatch:
#   permissions:
#     contents: write          # back-merge branch push
#     pull-requests: write     # back-merge pull request
#   jobs:
#     gitflow:
#       uses: redrob-labs/.github/.github/workflows/gitflow.yml@main
#
# Check names seen by branch protection are then `gitflow / branch name follows the convention`
# and `gitflow / main is contained in develop`.
#
# The type list is deliberately NOT an input. Seven variants grew across thirteen repositories
# while each kept "its own" list; the whole point of this file is that there is one.

name: gitflow

on:
  workflow_call:
    inputs:
      auto_backmerge:
        description: >-
          When main is ahead of develop, push `sync/back-merge-<short-sha>` and open a pull request
          into develop instead of only failing. Needs contents:write + pull-requests:write from the caller.
        type: boolean
        default: true
      develop:
        description: Name of the integration branch
        type: string
        default: develop
      main:
        description: Name of the release branch
        type: string
        default: main

permissions:
  contents: read

env:
  # The one list. `sync` is the type of a back-merge or upstream-sync branch; `release` and `hotfix`
  # are gitflow's own; the rest are conventional-commit types. Keep CONTRIBUTING.md's table in step.
  ALLOWED_TYPES: feat fix chore docs test refactor perf ci build sync hotfix release

jobs:
  branch-name:
    name: branch name follows the convention
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check the head branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          DEVELOP: ${{ inputs.develop }}
          MAIN: ${{ inputs.main }}
        run: |
          set -euo pipefail

          # The long-lived branches reach here through a promotion or a back-merge pull request;
          # they are not named after a type.
          if [ "$HEAD_REF" = "$DEVELOP" ] || [ "$HEAD_REF" = "$MAIN" ]; then
            echo "$HEAD_REF is a long-lived branch, not a working branch"
            exit 0
          fi

          type="${HEAD_REF%%/*}"
          slug="${HEAD_REF#*/}"

          if [ "$type" = "$HEAD_REF" ]; then
            echo "::error::branch '$HEAD_REF' has no type prefix. Use <type>/<slug>, type one of: $ALLOWED_TYPES"
            exit 1
          fi

          ok=false
          for t in $ALLOWED_TYPES; do
            [ "$type" = "$t" ] && ok=true && break
          done

          if [ "$ok" != true ]; then
            {
              echo "### Branch name is not one of the redrob-labs types"
              echo
              echo "\`$HEAD_REF\` uses the prefix \`$type\`. Allowed: $ALLOWED_TYPES"
              echo
              echo "A branch name says what the change is, not who or what made it. An agent or tool name"
              echo "is not a type: rename the branch and reopen the pull request."
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            echo "::error::branch prefix '$type' is not allowed. Use one of: $ALLOWED_TYPES"
            exit 1
          fi

          if [ -z "$slug" ] || [ "$slug" = "$type" ]; then
            echo "::error::branch '$HEAD_REF' has an empty slug. Use <type>/<short-slug>."
            exit 1
          fi

          echo "$HEAD_REF is a valid $type branch targeting $BASE_REF"

  back-merged:
    name: main is contained in develop
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      DEVELOP: ${{ inputs.develop }}
      MAIN: ${{ inputs.main }}
      AUTO: ${{ inputs.auto_backmerge }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: comparing two branches needs the commits, and a shallow clone answers with
          # whatever it happens to have, which is worse than no answer.
          fetch-depth: 0

      - name: Compare main against develop
        id: compare
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify "origin/$DEVELOP" >/dev/null; then
            echo "::notice::no $DEVELOP branch; nothing to back-merge into"
            echo "missing=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing="$(git rev-list --count "origin/$DEVELOP..origin/$MAIN")"
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          if [ "$missing" -eq 0 ]; then
            echo "$MAIN is contained in $DEVELOP"
            exit 0
          fi
          {
            echo "### \`$MAIN\` has $missing commit(s) \`$DEVELOP\` does not"
            echo
            # shellcheck disable=SC2016  # the backticks are markdown for the step summary, not expansion
            git log --format='- `%h` %s' "origin/$DEVELOP..origin/$MAIN"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          git log --oneline "origin/$DEVELOP..origin/$MAIN"

      - name: Open or refresh the back-merge pull request
        if: steps.compare.outputs.missing != '0' && inputs.auto_backmerge
        run: |
          set -euo pipefail
          short="$(git rev-parse --short "origin/$MAIN")"
          branch="sync/back-merge-$short"
          # One branch per main head: a second push to main gets its own branch and pull request,
          # and the earlier one merges or closes on its own merit.
          git push -q origin "origin/$MAIN:refs/heads/$branch" 2>/dev/null || true
          existing="$(gh pr list --head "$branch" --base "$DEVELOP" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "back-merge pull request #$existing already open"
            exit 0
          fi
          body="$(printf '%s\n\n%s\n\n%s\n' \
            "\`$MAIN\` is ahead of \`$DEVELOP\`; this merges it back so a branch cut from \`$DEVELOP\` carries the release and hotfix commits." \
            "Opened by the shared gitflow workflow. Merge with a **merge commit** (not squash), so \`$MAIN\` becomes contained in \`$DEVELOP\`." \
            "$(git log --format='- `%h` %s' "origin/$DEVELOP..origin/$MAIN")")"
          url="$(gh pr create --base "$DEVELOP" --head "$branch" \
            --title "Sync $MAIN back into $DEVELOP ($short)" --body "$body")"
          echo "opened $url"
          echo "Back-merge pull request: $url" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - name: Verdict
        if: steps.compare.outputs.missing != '0'
        run: |
          echo "::error::$MAIN is ${{ steps.compare.outputs.missing }} commit(s) ahead of $DEVELOP; merge the back-merge pull request"
          exit 1
