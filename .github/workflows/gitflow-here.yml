# Gitflow rules for this repository. The reusable workflow itself is .github/workflows/gitflow.yml.

name: gitflow

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  gitflow:
    uses: redrob-labs/.github/.github/workflows/gitflow.yml@main
